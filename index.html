<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futterassi</title>

<!-- Standard PWA -->
<meta name="theme-color" content="#0D5557">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">

<!-- iOS/iPadOS: App-artiges Verhalten beim Hinzufügen zum Home-Bildschirm -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Futterassi">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<!-- iOS Splash-Screens, verhindert weißes Aufblitzen beim App-Start -->
<link rel="apple-touch-startup-image" href="splash-iphone.png"
  media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-iphone-max.png"
  media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-ipad-pro11.png"
  media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-ipad-pro13.png"
  media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;650;750&family=IBM+Plex+Mono:wght@500;650;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">Futterassi</div>
  <div class="tabs" id="tabs" role="tablist">
    <button class="tab active" type="button" role="tab" aria-selected="true" data-view="katalog">Katalog</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-view="planung">Planung</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-view="daten">Daten</button>
  </div>
</div>

<main class="app" id="app">
  <noscript>
    <p class="small-note">Für Futterassi muss JavaScript aktiv sein.</p>
  </noscript>
</main>

<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"></div>

<script src="app.js"></script>
</body>
</html>
